<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>RT-Subs JA -> VI</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      width: 340px;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      padding: 14px;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      font-weight: 700;
      font-size: 14px;
      color: #ffffff;
    }
    .server-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #94a3b8;
    }
    .server-online {
      background: rgba(16, 185, 129, 0.18);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.35);
    }
    .server-offline {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .card {
      background: #1e293b;
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .current-site-label {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      font-weight: 600;
    }
    .current-site-host {
      font-size: 14px;
      font-weight: 700;
      color: #f1f5f9;
      margin-bottom: 10px;
      word-break: break-all;
    }
    .toggle-btn {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.15s ease, transform 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .toggle-btn:active {
      transform: scale(0.98);
    }
    .toggle-btn-off {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      box-shadow: 0 3px 10px rgba(16, 185, 129, 0.35);
    }
    .toggle-btn-on {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }
    .toggle-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      margin: 0 0 8px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .add-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .add-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 7px 10px;
      color: #f8fafc;
      font-size: 12.5px;
      outline: none;
    }
    .add-input:focus {
      border-color: #10b981;
    }
    .add-btn {
      background: #334155;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .add-btn:hover {
      background: #475569;
    }
    .domain-list {
      max-height: 175px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .domain-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12.5px;
      color: #e2e8f0;
    }
    .domain-remove {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 5px;
      border-radius: 4px;
    }
    .domain-remove:hover {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
    }
    .empty-msg {
      text-align: center;
      color: #64748b;
      font-size: 12px;
      padding: 12px 6px;
    }
    .hint {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 8px;
      line-height: 1.35;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span>🇻🇳</span>
      <span>RT-Subs JA ➔ VI</span>
    </div>
    <div id="serverBadge" class="server-badge">Đang kiểm tra…</div>
  </div>

  <div class="card">
    <div class="current-site-label">Trang web đang mở</div>
    <div id="currentHost" class="current-site-host">—</div>
    <button id="toggleSiteBtn" class="toggle-btn toggle-btn-off" disabled>
      Bật phụ đề trên trang này
    </button>
  </div>

  <div class="card" style="margin-bottom: 4px;">
    <div class="section-title">
      <span>Các trang web được phép chạy</span>
      <span id="domainCount" style="color:#10b981;">0</span>
    </div>
    <div class="add-row">
      <input id="domainInput" class="add-input" type="text" placeholder="Nhập tên miền (vd: missav.ws)..." />
      <button id="addDomainBtn" class="add-btn">Thêm</button>
    </div>
    <div id="domainList" class="domain-list"></div>
  </div>

  <div class="hint">
    Extension chỉ hiện nút <b>VI · Phụ đề</b> trên các trang trong danh sách này.
  </div>

  <script src="popup.js"></script>
</body>
</html>
